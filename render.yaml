services:
  # 1. Backend Web Service on Render
  - type: web
    name: poultry-weight-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: "npm install && npm run prisma:generate && npm run build && npm run db:init"
    startCommand: "npm start"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: poultry-weight-db
          property: connectionString

# 2. Managed PostgreSQL Database on Render
databases:
  - name: poultry-weight-db
    plan: free
    region: oregon
    databaseName: poultry_flocks
    user: poultry_admin
